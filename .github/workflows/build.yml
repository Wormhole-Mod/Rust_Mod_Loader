name: Build RML .hnmod

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build for Android with NDK
        uses: bbqsrc/cargo-ndk-action@v2
        with:
          target: aarch64-linux-android
          command: build
          args: --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_mod_loader-hnmod
          path: target/aarch64-linux-android/release/librust_mod_loader.so
          
