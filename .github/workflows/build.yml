name: Build RML .hnmod

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build for Android with cargo-ndk
        run: cargo ndk -t arm64-v8a build --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_mod_loader-hnmod
          path: target/aarch64-linux-android/release/librust_mod_loader.so
          
