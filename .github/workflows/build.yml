name: Build RML .hnmod

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Android NDK & Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang llvm
          rustup target add aarch64-linux-android
          
      - name: Build for Android (ARM64 Release)
        run: cargo build --release --target aarch64-linux-android

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust_mod_loader-hnmod
          path: target/aarch64-linux-android/release/librust_mod_loader.so
          
