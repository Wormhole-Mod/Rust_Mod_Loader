[package]
name = "rust_mod_loader"
version = "1.0.0"
edition = "2021"

[lib]
name = "rust_mod_loader"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Lua scripting engine bindings (Lua 5.4 / LuaJIT compatible features)
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }

# Serialization for config/disabled mod states and data parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async and HTTP utilities for unrestricted file/network access
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Logging for debugging via mobile logcats
log = "0.4"
